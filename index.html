const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});let im=new Image(),corn=[],ans={},scores={};
function load(f){if(!f)return;document.getElementById('msg').textContent='Loading…';let r=new FileReader();r.onload=e=>{im=new Image();im.onload=()=>{let s=Math.min(1,1600/im.width);cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);ctx.drawImage(im,0,0,cv.width,cv.height);corn=[];draw();document.getElementById('wrap').style.display='block';document.getElementById('msg').textContent='✓ Photo loaded';stat()};im.src=e.target.result};r.readAsDataURL(f)}
cam.onchange=e=>load(e.target.files[0]);pick.onchange=e=>load(e.target.files[0]);
cv.onpointerdown=e=>{if(!im.naturalWidth||corn.length>=4)return;let r=cv.getBoundingClientRect();corn.push([(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]);draw();stat()};
function draw(){ctx.drawImage(im,0,0,cv.width,cv.height);ctx.lineWidth=4;ctx.strokeStyle='#2563eb';ctx.fillStyle='#2563eb';corn.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],9,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText(i+1,p[0]-3,p[1]+4);ctx.fillStyle='#2563eb'});if(corn.length>1){ctx.beginPath();ctx.moveTo(...corn[0]);for(let i=1;i<corn.length;i++)ctx.lineTo(...corn[i]);if(corn.length==4)ctx.closePath();ctx.stroke()}}
function stat(){let n=['top-left','top-right','bottom-right','bottom-left'];st.innerHTML=corn.length<4?'Tap '+n[corn.length]+' corner ('+(corn.length+1)+' of 4).':'<span class=ok>✓ Ready to scan.</span>';scan.disabled=corn.length!==4;undo.disabled=!corn.length}
undo.onclick=()=>{corn.pop();draw();stat()};reset.onclick=()=>location.reload();
function solve(A,b){let n=b.length;for(let i=0;i<n;i++){let m=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[m][i]))m=j;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];let d=A[i][i];for(let k=i;k<n;k++)A[i][k]/=d;b[i]/=d;for(let j=0;j<n;j++)if(j!=i){let f=A[j][i];for(let k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}return b}
function H(src,dst){let A=[],b=[];for(let i=0;i<4;i++){let[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}return[...solve(A,b),1]}
function mp(h,x,y){let d=h[6]*x+h[7]*y+h[8];return[(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d]}
function g(data,w,h,x,y){x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.min(h-1,Math.round(y)));let i=(y*w+x)*4;return .299*data[i]+.587*data[i+1]+.114*data[i+2]}
function bs(data,w,h,hm,x,y){let c=mp(hm,x,y),px=mp(hm,x+8,y),py=mp(hm,x,y+5),vx=[px[0]-c[0],px[1]-c[1]],vy=[py[0]-c[0],py[1]-c[1]],dark=0,n=0;for(let iy=-6;iy<=6;iy++)for(let ix=-9;ix<=9;ix++){let nx=ix/9,ny=iy/6;if(nx*nx+ny*ny<=1){let xx=c[0]+vx[0]*(ix/8)+vy[0]*(iy/5),yy=c[1]+vx[1]*(ix/8)+vy[1]*(iy/5);if(g(data,w,h,xx,yy)<135)dark++;n++}}return dark/n}
scan.onclick=()=>{let hm=H(MC,corn),data=ctx.getImageData(0,0,cv.width,cv.height).data;for(let q=1;q<=60;q++){let rows=C.filter(z=>z[0]==q),ss=rows.map(z=>bs(data,cv.width,cv.height,hm,z[2],z[3]));scores[q]=ss;let o=[0,1,2,3].sort((a,b)=>ss[b]-ss[a]),best=ss[o[0]],second=ss[o[1]],a='?';if(best<.27)a='-';else if(best>.34&&best-second>.09)a=String(o[0]+1);else if(best>.36&&second>.31)a='M';ans[q]=a}render()};
function render(){res.innerHTML='';let d=0,r=0,b=0,db=[];for(let q=1;q<=60;q++){let a=ans[q];if(/[1-4]/.test(a))d++;else if(a=='-')b++;else r++;db.push('Q'+q+': '+scores[q].map((v,i)=>(i+1)+'='+Math.round(v*100)+'%').join(' | ')+' => '+a);let el=document.createElement('div');el.className='q';el.innerHTML='<div class=qh><span>Q'+q+'</span><span class="'+((a=='?'||a=='M')?'flag':'ok')+'">'+(a=='?'?'REVIEW':a=='M'?'MULTIPLE':a=='-'?'BLANK':'✓ '+a)+'</span></div><div class=choices>'+[1,2,3,4].map(n=>'<button data-q='+q+' data-a='+n+' class="'+(a==n?'sel':'')+'">'+n+'</button>').join('')+'</div>';res.appendChild(el)}res.querySelectorAll('button').forEach(x=>x.onclick=()=>{ans[x.dataset.q]=x.dataset.a;render()});dn.textContent=d;rn.textContent=r;bn.textContent=b;dbg.value=db.join('\n');rescard.style.display='block';rescard.scrollIntoView({behavior:'smooth'})}
