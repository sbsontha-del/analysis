<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAS Pro</title></head><body><p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px">Loading OAS Pro…</p><script>
fetch('app-v7.html?marks=10').then(r=>r.text()).then(src=>{
  const uiPatch=`  html=html.replace('<select id="assSelect" style="max-width:320px"></select>','<select id="assSelect" style="max-width:320px"></select><button id="editAss" class="btn alt">✏️ Edit selected</button><span id="editStatus" class="tip" style="width:100%"></span>');\n  html=html.replace('>Total marks</label><input id="assTotalMarks" type="text" value="30" readonly>','>Calculated total marks</label><input id="assTotalMarks" type="text" value="30" readonly>');\n  html=html.replace('<div class="card"><h3>Learning Objectives & Marks</h3>','<div class="card"><h3>Marks per Question</h3><p class="tip">Set each question independently. For example, Q1 can be 1 mark, Q2 can be 2 marks, Q3 can be 1 mark. The total marks will be calculated automatically.</p><textarea id="quickMarks" placeholder="Paste marks in question order, e.g. 1,1,2,1,2,1..."></textarea><div class="row" style="margin-top:8px"><button id="applyMarks" class="btn alt">Apply marks list</button><button id="allOneMark" class="btn alt">Set all to 1 mark</button></div><div id="marksGrid" class="keygrid" style="margin-top:12px"></div></div><div class="card"><h3>Learning Objectives & Marks</h3>');\n`;
  src=src.replace('  const patch=`<script>',uiPatch+'  const patch=`<script>');
  const behavior=`\n  function renderMarksGrid(a){\n    if(!$('marksGrid'))return;\n    $('marksGrid').innerHTML='';\n    if(!a)return;\n    const max=qCount(a);\n    for(let q=1;q<=max;q++){\n      const d=document.createElement('div');d.className='keycell';\n      d.innerHTML='<b>Q'+q+'</b><div style="margin-top:6px"><label style="font-size:12px;font-weight:800">Marks</label><input data-qmark="'+q+'" type="number" min="0" step="0.5" value="'+markFor(a,q)+'"></div>';\n      $('marksGrid').appendChild(d);\n    }\n    document.querySelectorAll('[data-qmark]').forEach(i=>i.oninput=()=>{\n      const a=currentAss();if(!a)return;if(!a.marks)a.marks={};\n      let v=parseFloat(i.value);a.marks[i.dataset.qmark]=Number.isFinite(v)&&v>=0?v:0;\n      const twin=document.querySelector('[data-mq="'+i.dataset.qmark+'"]');if(twin)twin.value=a.marks[i.dataset.qmark];\n      updateTotalBox(a);\n    });\n    updateTotalBox(a);\n  }\n\n  const originalLoadAss=loadAss;\n  loadAss=function(){originalLoadAss();renderMarksGrid(currentAss())};\n\n  if($('assQuestionCount'))$('assQuestionCount').addEventListener('input',()=>setTimeout(()=>renderMarksGrid(currentAss()),0));\n\n  if($('applyMarks'))$('applyMarks').onclick=()=>{\n    let a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    if(!a.marks)a.marks={};\n    const vals=$('quickMarks').value.trim().split(/[\\s,;|]+/).filter(Boolean);\n    if(!vals.length)return alert('Enter the marks first, for example: 1,1,2,1,2');\n    const max=qCount(a);\n    for(let q=1;q<=max;q++){\n      if(q<=vals.length){const v=parseFloat(vals[q-1]);if(Number.isFinite(v)&&v>=0)a.marks[q]=v}\n      else if(a.marks[q]==null)a.marks[q]=1;\n    }\n    renderMarksGrid(a);buildKey(a);updateTotalBox(a);\n  };\n\n  if($('allOneMark'))$('allOneMark').onclick=()=>{\n    let a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    if(!a.marks)a.marks={};for(let q=1;q<=qCount(a);q++)a.marks[q]=1;\n    renderMarksGrid(a);buildKey(a);updateTotalBox(a);\n  };\n\n  if($('editAss')){\n    $('editAss').onclick=()=>{\n      const id=$('assSelect').value;if(!id)return alert('Select an assessment first.');\n      currentId=id;try{localStorage.setItem('oaspro_current',currentId)}catch(e){}\n      loadAss();const a=currentAss();\n      if($('editStatus'))$('editStatus').innerHTML='<span class="ok">Editing <b>'+esc(a?.name||'assessment')+'</b>. Change any details or marks, then tap <b>Save assessment</b>.</span>';\n      window.scrollTo({top:0,behavior:'smooth'});\n    };\n  }\n`;
  src=src.replace('  refresh();\n})();',behavior+'\n  refresh();\n})();');
  src=src.replace("<title>OAS Pro</title>","<title>OAS Pro v10</title>");
  document.open();document.write(src);document.close();
}).catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:20px;color:#b91c1c">Could not load OAS Pro: '+e.message+'</p>'});
</script></body></html>
