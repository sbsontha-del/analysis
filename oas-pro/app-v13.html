<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v7.html?stable=13" title="OAS Pro"></iframe><script>
(function(){
 const frame=document.getElementById('app');let doneForDoc=null;
 function enhance(){
  let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}
  if(!d||!d.getElementById('loGrid')||doneForDoc===d)return;
  doneForDoc=d;
  const loGrid=d.getElementById('loGrid');
  const card=loGrid.closest('.card');
  if(!card)return;
  const tip=card.querySelector('.tip');
  if(tip)tip.textContent='Enter the LO/topic for each question. The mark box stays directly below its LO. Questions with no LO default to 0 marks.';

  const controls=d.createElement('div');
  controls.id='loMarkTools';
  controls.innerHTML=`<div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc"><h4 style="margin:0 0 8px">Paste LO / Topic List</h4><p class="tip" style="margin:0 0 8px">One line per question. Leave a line blank if that question has no LO.</p><textarea id="bulkLoList" placeholder="Example:\nLife cycles\nPlant growth\n\nMagnets"></textarea><button id="applyBulkLo" class="btn alt" style="margin-top:8px">Apply LO list</button></div><div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc"><h4 style="margin:0 0 8px">Apply Marks to Questions</h4><div class="grid g2"><div><label style="font-size:12px;font-weight:800">Question set</label><select id="bulkMarkSet"></select></div><div><label style="font-size:12px;font-weight:800">Mark value</label><input id="bulkMarkValue" type="number" min="0" step="0.5" value="1"></div></div><div id="customRange" class="grid g2" style="display:none;margin-top:8px"><div><label style="font-size:12px;font-weight:800">From question</label><select id="bulkFrom"></select></div><div><label style="font-size:12px;font-weight:800">To question</label><select id="bulkTo"></select></div></div><button id="applyBulkMarks" class="btn alt" style="margin-top:8px">Apply marks</button></div>`;
  loGrid.parentNode.insertBefore(controls,loGrid);

  function markInputs(){return [...d.querySelectorAll('[data-mq]')]}
  function loInputs(){return [...d.querySelectorAll('[data-loq]')]}
  function maxQ(){return Math.max(0,...loInputs().map(x=>Number(x.dataset.loq)||0),...markInputs().map(x=>Number(x.dataset.mq)||0))}
  function setMark(q,v){const i=d.querySelector('[data-mq="'+q+'"]');if(!i)return;i.value=String(v);i.dispatchEvent(new Event('input',{bubbles:true}))}
  function syncBlankLoDefaults(){loInputs().forEach(i=>{if(!i.value.trim()){const m=d.querySelector('[data-mq="'+i.dataset.loq+'"]');if(m&&(m.value===''||Number(m.value)===1))setMark(Number(i.dataset.loq),0)}})}
  function fillSets(){
    const max=maxQ(),s=d.getElementById('bulkMarkSet');if(!s||!max)return;
    const opts=[['all','All questions']];
    for(let a=1;a<=max;a+=5){const b=Math.min(max,a+4);opts.push(['r:'+a+'-'+b,'Q'+a+'–Q'+b])}
    opts.push(['withlo','Questions with an LO'],['nolo','Questions without an LO'],['custom','Custom range…']);
    s.innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
    const from=d.getElementById('bulkFrom'),to=d.getElementById('bulkTo');
    const qopts=Array.from({length:max},(_,i)=>'<option value="'+(i+1)+'">Q'+(i+1)+'</option>').join('');
    from.innerHTML=qopts;to.innerHTML=qopts;to.value=String(max);
  }
  fillSets();syncBlankLoDefaults();

  d.getElementById('bulkMarkSet').addEventListener('change',e=>{d.getElementById('customRange').style.display=e.target.value==='custom'?'grid':'none'});
  d.getElementById('applyBulkMarks').addEventListener('click',()=>{
    const v=Number(d.getElementById('bulkMarkValue').value);if(!Number.isFinite(v)||v<0){alert('Enter a valid mark value.');return}
    const mode=d.getElementById('bulkMarkSet').value,max=maxQ();let qs=[];
    if(mode==='all')qs=Array.from({length:max},(_,i)=>i+1);
    else if(mode==='withlo')qs=loInputs().filter(i=>i.value.trim()).map(i=>Number(i.dataset.loq));
    else if(mode==='nolo')qs=loInputs().filter(i=>!i.value.trim()).map(i=>Number(i.dataset.loq));
    else if(mode==='custom'){let a=Number(d.getElementById('bulkFrom').value),b=Number(d.getElementById('bulkTo').value);if(a>b)[a,b]=[b,a];for(let q=a;q<=b;q++)qs.push(q)}
    else if(mode.startsWith('r:')){let [a,b]=mode.slice(2).split('-').map(Number);for(let q=a;q<=b;q++)qs.push(q)}
    qs.forEach(q=>setMark(q,v));
  });

  d.getElementById('applyBulkLo').addEventListener('click',()=>{
    const lines=d.getElementById('bulkLoList').value.replace(/\r/g,'').split('\n');
    loInputs().forEach((i,idx)=>{i.value=(lines[idx]||'').trim();i.dispatchEvent(new Event('change',{bubbles:true}));if(!i.value.trim())setMark(Number(i.dataset.loq),0)});
  });

  loInputs().forEach(i=>i.addEventListener('change',()=>{if(!i.value.trim())setMark(Number(i.dataset.loq),0)}));

  const assSel=d.getElementById('assSelect');
  if(assSel&&!d.getElementById('editSelectedAss')){
    const b=d.createElement('button');b.id='editSelectedAss';b.className='btn alt';b.textContent='✏️ Edit selected';
    assSel.insertAdjacentElement('afterend',b);
    b.addEventListener('click',()=>{if(!assSel.value){alert('Select an assessment first.');return}assSel.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>{doneForDoc=null;enhance();d.getElementById('assessment')?.scrollIntoView({behavior:'smooth',block:'start'})},100)});
  }

  const observer=new MutationObserver(()=>{fillSets();syncBlankLoDefaults()});
  observer.observe(loGrid,{childList:true,subtree:true});
 }
 frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{enhance();if(++n>100)clearInterval(t)},100)});
 setInterval(enhance,1000);
})();
</script></body></html>
