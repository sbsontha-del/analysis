<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAS Pro</title></head><body><p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px">Loading OAS Pro…</p><script>
fetch('app-v11.html?bulk=12').then(r=>r.text()).then(src=>{
  const uiPatch=`  html=html.replace('<div class="card"><h3>Marks per Question</h3><p class="tip">Marks are independent of the LO. Set questions individually, paste a marks list, or apply the same mark to every question.</p><textarea id="quickMarks" placeholder="Paste marks in question order, e.g. 1,1,2,1,2,1..."></textarea><div class="row" style="margin-top:8px"><button id="applyMarks" class="btn alt">Apply marks list</button><input id="sameMarkValue" type="number" min="0" step="0.5" value="1" style="max-width:110px" aria-label="Same mark for all questions"><button id="applySameMark" class="btn alt">Apply to all</button></div><div id="marksGrid" class="keygrid" style="margin-top:12px"></div></div>','<div class="card"><h3>Marks per Question</h3><p class="tip">Questions without an LO default to 0 marks. You can still override them manually if needed.</p><textarea id="quickMarks" placeholder="Paste marks in question order, e.g. 1,1,2,1,2,1..."></textarea><div class="row" style="margin-top:8px"><button id="applyMarks" class="btn alt">Apply marks list</button><input id="sameMarkValue" type="number" min="0" step="0.5" value="1" style="max-width:110px" aria-label="Same mark for all questions"><button id="applySameMark" class="btn alt">Apply to all</button></div><hr style="border:0;border-top:1px solid #e5e7eb;margin:14px 0"><h4 style="margin:0 0 8px">Bulk Apply to a Set of Questions</h4><div class="grid g2"><div><label style="font-size:12px;font-weight:800">Question set</label><select id="markSet"></select></div><div><label style="font-size:12px;font-weight:800">Mark value</label><input id="setMarkValue" type="number" min="0" step="0.5" value="1"></div></div><div id="customSetWrap" style="display:none;margin-top:8px"><label style="font-size:12px;font-weight:800">Custom questions</label><input id="customQuestionSet" placeholder="Example: 1-10, 15, 18-20"></div><button id="applyMarkSet" class="btn alt" style="margin-top:8px">Apply to selected set</button><div id="marksGrid" class="keygrid" style="margin-top:12px"></div></div>');\n`;
  src=src.replace('  const patch=`<script>',uiPatch+'  const patch=`<script>');

  const behavior=`\n  function syncLoDefaults(a){\n    if(!a)return;if(!a.marks)a.marks={};if(!a.lo)a.lo={};\n    if(!a._loZeroMigrated){\n      for(let q=1;q<=qCount(a);q++){\n        if(!String(a.lo[q]||'').trim() && (a.marks[q]==null || Number(a.marks[q])===1)) a.marks[q]=0;\n      }\n      a._loZeroMigrated=true;\n      try{localStorage.setItem('oaspro_assessments',JSON.stringify(assessments))}catch(e){}\n    }\n  }\n\n  const priorLoadAss=loadAss;\n  loadAss=function(){\n    syncLoDefaults(currentAss());\n    priorLoadAss();\n    populateMarkSets(currentAss());\n  };\n\n  function populateMarkSets(a){\n    if(!$('markSet')||!a)return;const max=qCount(a),opts=[];\n    opts.push(['all','All questions']);\n    for(let s=1;s<=max;s+=5){let e=Math.min(max,s+4);opts.push(['range:'+s+'-'+e,'Q'+s+'–Q'+e])}\n    if(max>=10){for(let s=1;s<=max;s+=10){let e=Math.min(max,s+9);opts.push(['range:'+s+'-'+e,'Q'+s+'–Q'+e])}}\n    opts.push(['odd','Odd-numbered questions'],['even','Even-numbered questions'],['withlo','Questions with an LO'],['nolo','Questions without an LO'],['custom','Custom set…']);\n    const old=$('markSet').value;$('markSet').innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');if(opts.some(o=>o[0]===old))$('markSet').value=old;\n    if($('customSetWrap'))$('customSetWrap').style.display=$('markSet').value==='custom'?'block':'none';\n  }\n\n  if($('markSet'))$('markSet').onchange=()=>{if($('customSetWrap'))$('customSetWrap').style.display=$('markSet').value==='custom'?'block':'none'};\n\n  function parseCustomSet(text,max){\n    const out=new Set();\n    String(text||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(part=>{\n      const m=part.match(/^(\\d+)\\s*-\\s*(\\d+)$/);\n      if(m){let a=Number(m[1]),b=Number(m[2]);if(a>b)[a,b]=[b,a];for(let q=a;q<=b;q++)if(q>=1&&q<=max)out.add(q)}\n      else{const q=Number(part);if(Number.isInteger(q)&&q>=1&&q<=max)out.add(q)}\n    });\n    return [...out].sort((a,b)=>a-b);\n  }\n\n  if($('applyMarkSet'))$('applyMarkSet').onclick=()=>{\n    const a=currentAss();if(!a)return alert('Select or create an assessment first.');syncLoDefaults(a);\n    const v=parseFloat($('setMarkValue').value);if(!Number.isFinite(v)||v<0)return alert('Enter a valid mark value.');\n    const max=qCount(a),mode=$('markSet').value;let qs=[];\n    if(mode==='all')qs=Array.from({length:max},(_,i)=>i+1);\n    else if(mode==='odd')qs=Array.from({length:max},(_,i)=>i+1).filter(q=>q%2===1);\n    else if(mode==='even')qs=Array.from({length:max},(_,i)=>i+1).filter(q=>q%2===0);\n    else if(mode==='withlo')qs=Array.from({length:max},(_,i)=>i+1).filter(q=>String(a.lo?.[q]||'').trim());\n    else if(mode==='nolo')qs=Array.from({length:max},(_,i)=>i+1).filter(q=>!String(a.lo?.[q]||'').trim());\n    else if(mode.startsWith('range:')){const p=mode.slice(6).split('-').map(Number);for(let q=p[0];q<=p[1];q++)qs.push(q)}\n    else if(mode==='custom')qs=parseCustomSet($('customQuestionSet').value,max);\n    if(!qs.length)return alert('No questions were selected.');\n    if(!a.marks)a.marks={};qs.forEach(q=>a.marks[q]=v);renderMarksGrid(a);updateTotalBox(a);\n  };\n\n  const oldApplyLo=$('applyLo')?.onclick;\n  if($('applyLo'))$('applyLo').onclick=()=>{\n    const a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    const lines=$('quickLo').value.replace(/\\r/g,'').split('\\n'),max=qCount(a);a.lo=a.lo||{};a.marks=a.marks||{};\n    for(let q=1;q<=max;q++){\n      const prev=String(a.lo[q]||'').trim(),next=(lines[q-1]||'').trim();a.lo[q]=next;\n      if(!next)a.marks[q]=0;\n      else if(!prev && Number(a.marks[q]||0)===0)a.marks[q]=1;\n    }\n    buildKey(a);renderMarksGrid(a);updateTotalBox(a);populateMarkSets(a);\n  };\n\n  document.addEventListener('change',e=>{\n    if(!e.target.matches('[data-loq]'))return;const a=currentAss();if(!a)return;\n    const q=Number(e.target.dataset.loq),val=e.target.value.trim();a.lo=a.lo||{};a.marks=a.marks||{};a.lo[q]=val;\n    if(!val)a.marks[q]=0;else if(Number(a.marks[q]||0)===0)a.marks[q]=1;\n    renderMarksGrid(a);updateTotalBox(a);populateMarkSets(a);\n  });\n\n  assessments.forEach(syncLoDefaults);\n  try{localStorage.setItem('oaspro_assessments',JSON.stringify(assessments))}catch(e){}\n`;
  src=src.replace('  refresh();\n})();',behavior+'\n  refresh();\n})();');
  src=src.replace("<title>OAS Pro</title>","<title>OAS Pro v12</title>");
  document.open();document.write(src);document.close();
}).catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:20px;color:#b91c1c">Could not load OAS Pro: '+e.message+'</p>'});
</script></body></html>
