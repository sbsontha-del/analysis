<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro v25</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v24.html?v=25"></iframe><script>(function(){const F=document.getElementById('app');function docs(){let a=[];try{let D=F.contentDocument;for(let i=0;i<10;i++){a.push(D);let f=D.querySelector('iframe');if(!f||!f.contentDocument)break;D=f.contentDocument}}catch(e){}return a}function fixScreen(){docs().forEach(D=>{let root=D.getElementById('v18analysis');if(!root)return;let walker=D.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(/Common wrong:/i.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/Common wrong:\s*(\d+)\s*\((\d+)\)/gi,'Most Common Wrong Answer: Option $1 — $2 pupils')}})}setInterval(fixScreen,500)})();</script></body></html>
