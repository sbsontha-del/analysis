<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><iframe id="root" src="app-v18.html?stable=19"></iframe><script>
(function(){
function deep(){try{let D=document;for(let i=0;i<10;i++){let f=D.querySelector('iframe');if(!f||!f.contentDocument)break;D=f.contentDocument}return{D,W:D.defaultView}}catch(e){return null}}
function dat(W){try{return{a:JSON.parse(W.localStorage.getItem('oaspro_assessments')||'[]'),s:JSON.parse(W.localStorage.getItem('oaspro_scans')||'[]')}}catch(e){return{a:[],s:[]}}}
function cur(){let z=deep();if(!z)return null,x=dat(z.W),id=z.D.getElementById('analysisAss')?.value||z.W.currentId,a=x.a.find(v=>v.id===id);return{...z,a,rows:x.s.filter(v=>v.assessmentId===id)}}
function qn(a){let n=Number(a?.questionCount);return n>0?n:30}function pc(n,d){return d?Math.round(n/d*100):0}function safe(s){return String(s||'Results').replace(/[^a-z0-9_-]+/gi,'_').slice(0,55)}
function wrap(pdf,t,w){return pdf.splitTextToSize(String(t||''),w)}
function loStats(a,r){let o={};for(let q=1;q<=qn(a);q++){let L=(a.lo?.[q]||'').trim();if(!L)continue;if(!o[L])o[L]={e:0,t:0};let m=Number(a.marks?.[q]);if(!Number.isFinite(m))m=1;o[L].t+=m;if(String(r.answers?.[q])===String(a.key?.[q]))o[L].e+=m}return Object.entries(o)}
function draw(pdf,a,r,x,y,w,h){let pad=4,yy=y+6;pdf.setDrawColor(180);pdf.roundedRect(x,y,w,h,2,2);pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text(String(r.name||('Index '+(r.index||'-'))).slice(0,30),x+pad,yy);pdf.setFontSize(8);pdf.text('Index: '+String(r.index||'-'),x+w-32,yy);yy+=5;pdf.setFontSize(9);pdf.text((a.name||'Assessment')+'   Score: '+r.score+'/'+r.total+' ('+pc(r.score,r.total)+'%)',x+pad,yy);yy+=5;
 pdf.setFont('helvetica','bold');pdf.setFontSize(7.5);pdf.text('ANSWERS',x+pad,yy);yy+=3.5;pdf.setFont('helvetica','normal');pdf.setFontSize(6.3);let max=qn(a),cols=10,cw=(w-2*pad)/cols;for(let q=1;q<=max;q++){let row=Math.floor((q-1)/cols),col=(q-1)%cols,v=String(r.answers?.[q]||'-'),k=String(a.key?.[q]||'-'),ok=v===k,tx='Q'+q+' '+(ok?'('+v+') OK':v+' X('+k+')');pdf.text(tx,x+pad+col*cw,yy+row*3.5,{maxWidth:cw-1})}yy+=Math.ceil(max/cols)*3.5+3;
 pdf.setFont('helvetica','bold');pdf.setFontSize(7.5);pdf.text('LO ANALYSIS',x+pad,yy);yy+=3.5;pdf.setFont('helvetica','normal');pdf.setFontSize(6.2);let ls=loStats(a,r);for(let i=0;i<ls.length&&yy<y+h-42;i++){let [L,v]=ls[i],p=pc(v.e,v.t),lines=wrap(pdf,L,w-30);pdf.text(lines,x+pad,yy);pdf.text(v.e+'/'+v.t+'  '+p+'%',x+w-23,yy);yy+=Math.max(3.2,lines.length*2.7)}
 yy=Math.min(yy+2,y+h-39);pdf.setFont('helvetica','bold');pdf.setFontSize(7.5);pdf.text('ANNOTATED OAS',x+pad,yy);yy+=2;let ih=y+h-yy-4;if(r.scanImage&&ih>12){try{pdf.addImage(r.scanImage,'JPEG',x+pad,yy,w-2*pad,ih,undefined,'FAST')}catch(e){pdf.setFont('helvetica','normal');pdf.setFontSize(6.5);pdf.text('Scan image could not be added.',x+pad,yy+5)}}else{pdf.setFont('helvetica','normal');pdf.setFontSize(6.5);pdf.text('Original scan image not stored for this result.',x+pad,yy+5);let wrong=[];for(let q=1;q<=max;q++)if(String(r.answers?.[q])!==String(a.key?.[q]))wrong.push('Q'+q+': '+(r.answers?.[q]||'-')+' -> '+(a.key?.[q]||'-'));pdf.text(wrap(pdf,'Corrections: '+(wrong.join(', ')||'All correct'),w-2*pad),x+pad,yy+10)}}
function make(){let c=cur();if(!c?.a||!c.rows.length)return alert('No saved results for this assessment.');if(!window.jspdf)return alert('PDF library is loading. Please tap again in a moment.');let PDF=window.jspdf.jsPDF,p=new PDF({unit:'mm',format:'a4'}),slots=[8,150],h=139;c.rows.forEach((r,i)=>{if(i&&i%2===0)p.addPage();draw(p,c.a,r,8,slots[i%2],194,h)});p.save(safe(c.a.name)+'_Combined_2_Per_Page.pdf')}
function add(){let c=cur();if(!c?.D)return;let D=c.D;if(D.getElementById('combinedReport19'))return;let body=D.getElementById('resultsBody');if(!body)return;let card=body.closest('.card')||body.parentElement,box=D.createElement('div');box.id='combinedReport19';box.style.cssText='margin:12px 0;padding:14px;border:2px solid #bfdbfe;border-radius:14px;background:#eff6ff';box.innerHTML='<h3 style="margin:0 0 5px">Combined Pupil Report</h3><p class="tip">Each pupil report includes the answer analysis, LO analysis and annotated OAS together. Two pupils are placed on each A4 page.</p><button id="downloadCombined19" class="btn">Download Combined PDF — 2 Pupils per Page</button>';card.appendChild(box);D.getElementById('downloadCombined19').onclick=make}
setInterval(add,600)
})();
</script></body></html>
