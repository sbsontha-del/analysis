<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAS Pro Exact Template</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#111}header{padding:14px;background:white;position:sticky;top:0}button{padding:10px 14px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700}#wrap{max-width:900px;margin:16px auto;background:white;padding:10px}svg{width:100%;height:auto;display:block}@media print{body{background:white}header{display:none}#wrap{max-width:none;margin:0;padding:0}svg{width:100%;height:auto;page-break-inside:avoid}}</style></head><body><header><b>OAS Pro — Exact Printable Template</b> <button onclick="window.print()">Print / Save as PDF</button><div style="font-size:13px;color:#555;margin-top:6px">Use this version for scanning. The four black squares are SVG objects, so they print even when browser background graphics are off.</div></header><div id="wrap"><svg id="oas" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg"></svg></div><script>const s=document.getElementById('oas');const NS='http://www.w3.org/2000/svg';function E(n,a,t){let e=document.createElementNS(NS,n);for(let k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;s.appendChild(e);return e}function txt(x,y,t,sz=22,w='400',anchor='start'){return E('text',{x,y,'font-size':sz,'font-family':'Arial','font-weight':w,'text-anchor':anchor,fill:'#111'},t)}function line(x1,y1,x2,y2,w=2){E('line',{x1,y1,x2,y2,stroke:'#111','stroke-width':w})}function oval(cx,cy,label){E('ellipse',{cx,cy,rx:16,ry:10,fill:'white',stroke:'#111','stroke-width':2});txt(cx,cy+5,label,13,'400','middle')}E('rect',{x:10,y:10,width:1180,height:1580,fill:'white',stroke:'#111','stroke-width':2});[[60,60],[1140,60],[1140,1540],[60,1540]].forEach(([x,y])=>E('rect',{x:x-22,y:y-22,width:44,height:44,fill:'#000'}));txt(110,105,'NAME:',22,'700');line(190,108,610,108);txt(720,105,'DATE:',22,'700');line(790,108,1060,108);txt(110,150,'CLASS:',22,'700');line(190,153,610,153);txt(720,150,'SUBJECT:',22,'700');line(825,153,1060,153);E('rect',{x:150,y:165,width:570,height:200,fill:'none',stroke:'#777','stroke-width':2,'stroke-dasharray':'6 4'});txt(170,188,'INDEX NUMBER',17,'700');txt(270,188,'SHADE OVALS',17,'700');const x0=295,dx=42,ys=[210,245,280,315,350];for(let r=0;r<5;r++){txt(190,ys[r]+5,String(r+1),15,'700');for(let d=0;d<10;d++){E('ellipse',{cx:x0+d*dx,cy:ys[r],rx:13,ry:8,fill:'white',stroke:'#111','stroke-width':2});txt(x0+d*dx,ys[r]+4,String(d),10,'400','middle')}}function bubbleXY(q,opt){const col=Math.floor((q-1)/20),r=(q-1)%20;const xs=[[230,272,314,356],[522,564,606,648],[814,856,898,940]][col];const starts=[430,710,990,1270];return [xs[opt-1],starts[Math.floor(r/5)]+(r%5)*46]}for(let q=1;q<=60;q++){let [x,y]=bubbleXY(q,1);txt(x-55,y+6,String(q),17,'700','end');for(let o=1;o<=4;o++){let [cx,cy]=bubbleXY(q,o);oval(cx,cy,o)}}txt(600,1510,'OAS Pro Standard Template',15,'400','middle');</script></body></html>
