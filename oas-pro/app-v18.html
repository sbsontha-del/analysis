<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="root" src="app-v17.html?stable=18"></iframe><script>
(function(){
function deep(){try{let D=document;for(let i=0;i<8;i++){let f=D.querySelector('iframe');if(!f||!f.contentDocument)break;D=f.contentDocument}return {D,W:D.defaultView}}catch(e){return null}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function data(W){try{return{a:JSON.parse(W.localStorage.getItem('oaspro_assessments')||'[]'),s:JSON.parse(W.localStorage.getItem('oaspro_scans')||'[]')}}catch(e){return{a:[],s:[]}}}
function current(){let z=deep();if(!z)return null;let x=data(z.W),id=z.D.getElementById('analysisAss')?.value||z.W.currentId,a=x.a.find(v=>v.id===id);return{...z,a,rows:x.s.filter(v=>v.assessmentId===id)}}
function qn(a){let n=Number(a?.questionCount);return n>0?n:30}function pct(n,d){return d?Math.round(n/d*100):0}
function injectCSS(D){if(D.getElementById('v18css'))return;let s=D.createElement('style');s.id='v18css';s.textContent='.v18grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.v18stat{padding:12px;border-radius:12px;background:#f8fafc;text-align:center}.v18stat b{font-size:22px;display:block}.v18table{overflow:auto}.v18table table{min-width:700px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800}.good{background:#dcfce7;color:#166534}.mid{background:#fef3c7;color:#92400e}.weak{background:#fee2e2;color:#991b1b}.ansgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:7px}.anscell{border:1px solid #ddd;border-radius:10px;padding:8px;text-align:center}.anscell.ok{background:#f0fdf4}.anscell.no{background:#fff1f2}.oasOverlay{position:relative;max-width:850px;margin:auto}.oasOverlay img{width:100%;display:block}.markLayer{position:absolute;inset:0;pointer-events:none}.markSummary{position:absolute;top:2%;right:2%;background:#fffE;padding:8px;border-radius:10px;font-weight:900;font-size:12px;box-shadow:0 2px 8px #0003}.markStrip{position:absolute;left:2%;right:2%;bottom:2%;background:#fffE;padding:8px;border-radius:10px;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;font-size:10px}.markStrip span{padding:3px;text-align:center;border-radius:5px}.v18modal{display:none;position:fixed;inset:0;background:#0009;z-index:99;padding:12px;overflow:auto}.v18modal.open{display:block}.v18box{background:white;max-width:900px;margin:15px auto;padding:18px;border-radius:16px}';D.head.appendChild(s)}
function enhanceAnalysis(){let c=current();if(!c?.D)return;let {D,a,rows}=c;injectCSS(D);let heat=D.getElementById('heat');if(!heat||D.getElementById('v18analysis'))return;let card=heat.closest('.card');let box=D.createElement('div');box.id='v18analysis';box.className='card';box.innerHTML='<h3>Detailed Assessment Analysis</h3><div id="v18summary" class="v18grid"></div><h4>Question Analysis & Distractors</h4><div class="v18table"><table><thead><tr><th>Q</th><th>% Correct</th><th>Correct</th><th>Most Common Wrong Answer</th><th>LO</th><th>Status</th></tr></thead><tbody id="v18q"></tbody></table></div><h4>LO Mastery</h4><div id="v18lo"></div><h4>Intervention Groups</h4><div id="v18groups"></div>';card.parentNode.insertBefore(box,card.nextSibling);renderExtra()}
function renderExtra(){let c=current();if(!c?.a)return;let {D,a,rows}=c,S=D.getElementById('v18summary');if(!S)return;let ps=rows.map(r=>pct(r.score,r.total)).sort((x,y)=>x-y),mean=ps.length?Math.round(ps.reduce((x,y)=>x+y,0)/ps.length):0,median=ps.length?(ps.length%2?ps[(ps.length-1)/2]:Math.round((ps[ps.length/2-1]+ps[ps.length/2])/2)):0,pass=ps.length?pct(ps.filter(x=>x>=50).length,ps.length):0;S.innerHTML=[['Mean',mean+'%'],['Median',median+'%'],['Highest',(ps.at(-1)??0)+'%'],['Lowest',(ps[0]??0)+'%'],['Pass ≥50%',pass+'%']].map(x=>'<div class="v18stat"><b>'+x[1]+'</b>'+x[0]+'</div>').join('');let max=qn(a),qb=D.getElementById('v18q'),lo={};qb.innerHTML='';for(let q=1;q<=max;q++){let key=String(a.key?.[q]||''),ok=0,counts={1:0,2:0,3:0,4:0};rows.forEach(r=>{let v=String(r.answers?.[q]||'');if(v===key)ok++;else if(counts[v]!=null)counts[v]++});let p=pct(ok,rows.length),wrong=Object.entries(counts).sort((x,y)=>y[1]-x[1])[0],w=wrong&&wrong[1]?wrong[0]+' ('+wrong[1]+' pupils)':'—',L=(a.lo?.[q]||'').trim();if(L){if(!lo[L])lo[L]={ok:0,n:0,pup:{}};lo[L].ok+=ok;lo[L].n+=rows.length;rows.forEach(r=>{let id=r.id;lo[L].pup[id]=lo[L].pup[id]||{ok:0,n:0,r};lo[L].pup[id].n++;if(String(r.answers?.[q])===key)lo[L].pup[id].ok++})}let cls=p>=75?'good':p>=50?'mid':'weak',st=p>=75?'Mastered':p>=50?'Review':'Reteach';qb.innerHTML+='<tr><td>Q'+q+'</td><td>'+p+'%</td><td>'+ok+'/'+rows.length+'</td><td>'+w+'</td><td>'+esc(L||'—')+'</td><td><span class="pill '+cls+'">'+st+'</span></td></tr>'}let lb=D.getElementById('v18lo');lb.innerHTML=Object.entries(lo).map(([L,v])=>{let p=pct(v.ok,v.n),cl=p>=75?'good':p>=50?'mid':'weak';return '<div class="status"><b>'+esc(L)+'</b> — '+p+'% <span class="pill '+cl+'">'+(p>=75?'Mastered':p>=50?'Review':'Reteach')+'</span></div>'}).join('')||'<p class="tip">No LO mapping saved.</p>';let gb=D.getElementById('v18groups'),weak={};Object.entries(lo).forEach(([L,v])=>{let names=Object.values(v.pup).filter(x=>pct(x.ok,x.n)<50).map(x=>esc(x.r.name||('Index '+(x.r.index||'—'))));if(names.length)weak[L]=names});gb.innerHTML=Object.keys(weak).length?Object.entries(weak).map(([L,n])=>'<div class="status"><b>Reteach: '+esc(L)+'</b><br>'+n.join(', ')+'</div>').join(''):'<div class="status">No pupils currently below 50% for mapped LOs.</div>'}
function addSlipButtons(){let c=current();if(!c?.D)return;let {D}=c;D.querySelectorAll('[data-slip]').forEach(b=>{if(b.dataset.v18)return;b.dataset.v18='1';let v=D.createElement('button');v.className='btn alt';v.textContent='Answer Slip';v.style.marginLeft='5px';v.onclick=()=>showSlip(b.dataset.slip);let a=D.createElement('button');a.className='btn alt';a.textContent='Annotated OAS';a.style.marginLeft='5px';a.onclick=()=>showOAS(b.dataset.slip);b.insertAdjacentElement('afterend',a);b.insertAdjacentElement('afterend',v)})}
function ensureModal(D){if(D.getElementById('v18modal'))return;let m=D.createElement('div');m.id='v18modal';m.className='v18modal';m.innerHTML='<div class="v18box"><div style="text-align:right"><button id="v18close" class="btn alt">Close</button></div><div id="v18content"></div></div>';D.body.appendChild(m);D.getElementById('v18close').onclick=()=>m.classList.remove('open')}
function showSlip(id){let c=current();if(!c?.a)return;let {D,a,rows}=c,r=rows.find(x=>String(x.id)===String(id));if(!r)return;ensureModal(D);let max=qn(a),cells='';for(let q=1;q<=max;q++){let v=String(r.answers?.[q]||'-'),k=String(a.key?.[q]||'-'),ok=v===k;cells+='<div class="anscell '+(ok?'ok':'no')+'"><b>Q'+q+'</b><br>'+(ok?'('+esc(v)+') ✓':esc(v)+' ❌ ('+esc(k)+')')+'</div>'}D.getElementById('v18content').innerHTML='<h2>'+esc(a.name||'Assessment Result')+'</h2><p><b>'+esc(r.name||'—')+'</b> &nbsp; Index: '+esc(r.index||'—')+' &nbsp; Score: <b>'+r.score+'/'+r.total+' ('+pct(r.score,r.total)+'%)</b></p><h3>Question-by-Question Result</h3><div class="ansgrid">'+cells+'</div>';D.getElementById('v18modal').classList.add('open')}
function showOAS(id){let c=current();if(!c?.a)return;let {D,a,rows}=c,r=rows.find(x=>String(x.id)===String(id));if(!r)return;ensureModal(D);let max=qn(a),strip='';for(let q=1;q<=max;q++){let v=String(r.answers?.[q]||'-'),k=String(a.key?.[q]||'-'),ok=v===k;strip+='<span style="background:'+(ok?'#dcfce7':'#fee2e2')+'">Q'+q+' '+(ok?'✓':'✕ '+v+'→'+k)+'</span>'}let img=r.scanImage?'<img src="'+r.scanImage+'">':'<div class="status">The original scan image was not stored for this older result. New scans from v18 onward will save an image for annotation.</div>';D.getElementById('v18content').innerHTML='<h2>Annotated OAS — '+esc(r.name||('Index '+r.index))+'</h2><p class="tip">The original scan is preserved. Marking is displayed as an overlay.</p><div class="oasOverlay">'+img+(r.scanImage?'<div class="markLayer"><div class="markSummary">'+r.score+'/'+r.total+' · '+pct(r.score,r.total)+'%</div><div class="markStrip">'+strip+'</div></div>':'')+'</div>';D.getElementById('v18modal').classList.add('open')}
function captureScan(){let z=deep();if(!z?.D||z.D.body.dataset.v18save)return;let b=z.D.getElementById('saveScan');if(!b||typeof b.onclick!=='function')return;z.D.body.dataset.v18save='1';let old=b.onclick;b.onclick=function(e){let img='';try{let p=z.D.getElementById('preview');if(p&&p.width&&p.height)img=p.toDataURL('image/jpeg',0.72)}catch(x){}let idx=z.D.getElementById('studentIndex')?.value.trim(),aid=z.W.currentId;old.call(this,e);if(img){try{let arr=JSON.parse(z.W.localStorage.getItem('oaspro_scans')||'[]'),matches=arr.filter(r=>r.assessmentId===aid&&(!idx||String(r.index||'')===idx));let r=matches[matches.length-1];if(r){r.scanImage=img;z.W.localStorage.setItem('oaspro_scans',JSON.stringify(arr));if(z.W.scans)z.W.scans=arr}}catch(x){console.warn(x)}}}}
setInterval(()=>{try{enhanceAnalysis();renderExtra();addSlipButtons();captureScan()}catch(e){}},700)
})();
</script></body></html>
