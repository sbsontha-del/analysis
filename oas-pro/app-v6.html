<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAS Pro</title></head><body><p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px">Loading OAS Pro…</p><script>
fetch('app-v5.html?base=6').then(r=>r.text()).then(html=>{
 const oldSave=`$('saveScan').onclick=()=>{let a=currentAss();if(!a)return;let correct=0,total=0;for(let q=1;q<=60;q++)if(/^[1-4]$/.test(a.key?.[q]||'')){total++;if(String(workingAnswers[q])===String(a.key[q]))correct++}scans.push({id:uid(),assessmentId:a.id,index:$('studentIndex').value.trim(),name:$('studentName').value.trim(),answers:{...workingAnswers},score:correct,total,ts:new Date().toISOString()});persist();alert('Pupil result saved.');go('class')}`;
 const newSave=`$('saveScan').onclick=()=>{let a=currentAss();if(!a)return alert('Select an assessment first.');let correct=0,total=0;for(let q=1;q<=60;q++)if(/^[1-4]$/.test(a.key?.[q]||'')){total++;if(String(workingAnswers[q])===String(a.key[q]))correct++}let idx=$('studentIndex').value.trim(),name=$('studentName').value.trim(),rec={id:uid(),assessmentId:a.id,index:idx,name,answers:{...workingAnswers},score:correct,total,ts:new Date().toISOString()};try{let fresh=JSON.parse(localStorage.getItem('oaspro_scans')||'[]');let pos=idx?fresh.findIndex(x=>x.assessmentId===a.id&&String(x.index||'')===idx):-1;if(pos>=0){rec.id=fresh[pos].id;fresh[pos]=rec}else fresh.push(rec);localStorage.setItem('oaspro_scans',JSON.stringify(fresh));localStorage.setItem('oaspro_last_scan',JSON.stringify(rec));let check=JSON.parse(localStorage.getItem('oaspro_scans')||'[]');if(!check.some(x=>x.id===rec.id))throw new Error('Storage verification failed');scans=check;$('scanStatus').innerHTML='<span class="ok">✓ Result saved permanently in this browser.</span>';refresh();alert('Pupil result saved.');go('class')}catch(e){$('scanStatus').innerHTML='<span class="bad">Could not save result: '+esc(e.message)+'</span>';alert('The result could not be stored. Please keep this page open and try again.')}}`;
 if(html.includes(oldSave)) html=html.replace(oldSave,newSave);
 const oldRender=`function renderVerify(){let a=currentAss(),det=0,blank=0,correct=0,total=0;$('verify').innerHTML='';`;
 const newRender=`function renderVerify(){try{localStorage.setItem('oaspro_last_scan_draft',JSON.stringify({assessmentId:currentId,index:$('studentIndex').value.trim(),name:$('studentName').value.trim(),answers:{...workingAnswers},ts:new Date().toISOString()}))}catch(e){}let a=currentAss(),det=0,blank=0,correct=0,total=0;$('verify').innerHTML='';`;
 if(html.includes(oldRender)) html=html.replace(oldRender,newRender);

 const oldLo=`<div class="card"><h3>Learning Objectives</h3><p class="tip">Enter an LO/topic beside each question.</p><div id="loGrid" class="keygrid"></div></div>`;
 const newLo=`<div class="card"><h3>Learning Objectives / Topics</h3><p class="tip">Paste the topics in question order, one per line (Q1, Q2, Q3 …), then tap Apply Topic List. You can still edit individual questions below.</p><textarea id="quickLo" placeholder="Example:\nLife cycles\nPlant growth\nPlant parts and functions"></textarea><button id="applyLo" class="btn alt">Apply Topic List</button><div id="loGrid" class="keygrid" style="margin-top:12px"></div></div>`;
 if(html.includes(oldLo)) html=html.replace(oldLo,newLo);

 const hook=`$('analysisAss').onchange=renderAnalysis;`;
 const loHandler=`$('applyLo').onclick=()=>{let a=currentAss();if(!a){a=blankAss();assessments.push(a);currentId=a.id}let lines=$('quickLo').value.replace(/\\r/g,'').split('\\n').map(x=>x.trim());for(let i=0;i<Math.min(60,lines.length);i++){if(lines[i])a.lo[i+1]=lines[i]}persist();};`;
 if(html.includes(hook)) html=html.replace(hook,loHandler+hook);

 html=html.replace('<title>OAS Pro v5</title>','<title>OAS Pro v6</title>');
 html=html.replace('Self-calibrating bubble grid · strict OAS recognition · graphite scanning · LO analysis','Self-calibrating scanner · verified scan saving · bulk LO/topic entry');
 document.open();document.write(html);document.close();
}).catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:20px;color:#b91c1c">Could not load OAS Pro: '+e.message+'</p>'});
</script></body></html>
