<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro v21</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><iframe id="app" src="app-v20.html?v=21"></iframe><script>(function(){const F=document.getElementById('app');function deep(){try{let D=F.contentDocument;for(let i=0;i<5;i++){let f=D.querySelector('iframe');if(!f||!f.contentDocument)break;D=f.contentDocument}return{D,W:D.defaultView}}catch(e){return null}}function get(){let z=deep();if(!z)return null;try{let A=JSON.parse(z.W.localStorage.getItem('oaspro_assessments')||'[]'),S=JSON.parse(z.W.localStorage.getItem('oaspro_scans')||'[]'),id=z.D.getElementById('analysisAss')?.value||z.W.currentId,a=A.find(x=>x.id===id);return{...z,a,rows:S.filter(x=>x.assessmentId===id)}}catch(e){return null}}function pc(n,d){return d?Math.round(n/d*100):0}function qn(a){return Math.max(1,Math.min(60,Number(a?.questionCount)||30))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(s){return String(s||'Report').replace(/[^a-z0-9_-]+/gi,'_').slice(0,55)}function stats(c){let ps=c.rows.map(r=>pc(r.score,r.total)).sort((a,b)=>a-b);return{n:ps.length,mean:ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0,median:ps.length?(ps.length%2?ps[(ps.length-1)/2]:Math.round((ps[ps.length/2-1]+ps[ps.length/2])/2)):0,high:ps.at(-1)||0,low:ps[0]||0,pass:pc(ps.filter(x=>x>=50).length,ps.length)}}function questions(c){let out=[];for(let q=1;q<=qn(c.a);q++){let k=String(c.a.key?.[q]||''),ok=0,cnt={1:0,2:0,3:0,4:0};c.rows.forEach(r=>{let v=String(r.answers?.[q]||'');if(v===k)ok++;else if(cnt[v]!=null)cnt[v]++});let w=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0],p=pc(ok,c.rows.length);out.push({q,p,wrong:w&&w[1]?w[0]+' ('+w[1]+')':'-',lo:(c.a.lo?.[q]||'').trim()||'-',status:p>=75?'Mastered':p>=50?'Review':'Reteach'})}return out}function los(c){let m={};for(let q=1;q<=qn(c.a);q++){let L=(c.a.lo?.[q]||'').trim();if(!L)continue;if(!m[L])m[L]={ok:0,n:0,qs:[]};m[L].qs.push(q);c.rows.forEach(r=>{m[L].n++;if(String(r.answers?.[q])===String(c.a.key?.[q]))m[L].ok++})}return Object.entries(m).map(([L,v])=>{let p=pc(v.ok,v.n),names=c.rows.filter(r=>pc(v.qs.filter(q=>String(r.answers?.[q])===String(c.a.key?.[q])).length,v.qs.length)<50).map(r=>r.name||('Index '+(r.index||'-')));return{L,p,names}})}function reportPdf(){let c=get();if(!c?.a||!c.rows.length)return alert('No results for this assessment.');if(!window.jspdf)return alert('PDF library is loading.');let P=window.jspdf.jsPDF,p=new P({unit:'mm',format:'a4'}),s=stats(c),yy=14;p.setFont('helvetica','bold');p.setFontSize(16);p.text((c.a.name||'Assessment')+' — Class Analysis Report',12,yy);yy+=9;p.setFontSize(9);p.text('Pupils: '+s.n+'   Mean: '+s.mean+'%   Median: '+s.median+'%   Highest: '+s.high+'%   Lowest: '+s.low+'%   Pass >=50%: '+s.pass+'%',12,yy);yy+=9;p.setFontSize(11);p.text('Question & Distractor Analysis',12,yy);yy+=5;p.setFont('helvetica','normal');p.setFontSize(7);questions(c).forEach(v=>{let line='Q'+v.q+'  '+v.p+'% correct   Common wrong: '+v.wrong+'   '+v.status+'   '+v.lo;if(yy>285){p.addPage();yy=14}let t=p.splitTextToSize(line,185);p.text(t,12,yy);yy+=t.length*3.2+1});yy+=4;if(yy>270){p.addPage();yy=14}p.setFont('helvetica','bold');p.setFontSize(11);p.text('LO Mastery & Intervention Groups',12,yy);yy+=5;p.setFont('helvetica','normal');p.setFontSize(7);los(c).forEach(v=>{let line=v.L+' — '+v.p+'%'+(v.names.length?' | Reteach: '+v.names.join(', '):'');let t=p.splitTextToSize(line,185);if(yy+t.length*3.2>286){p.addPage();yy=14}p.text(t,12,yy);yy+=t.length*3.2+2});p.save(safe(c.a.name)+'_Class_Analysis_Report.pdf')}function csv(){let c=get();if(!c?.a)return;let rows=[['Section','Item','Value','Extra'],...Object.entries(stats(c)).map(([k,v])=>['Class Statistics',k,v,''])];questions(c).forEach(v=>rows.push(['Question Analysis','Q'+v.q,v.p+'% correct','Common wrong '+v.wrong+' | '+v.status+' | '+v.lo]));los(c).forEach(v=>rows.push(['LO Analysis',v.L,v.p+'%',v.names.length?'Reteach: '+v.names.join('; '):'']));let text=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),b=new Blob([text],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=safe(c.a.name)+'_Statistics.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function add(){let c=get();if(!c?.D)return;let D=c.D,body=D.getElementById('resultsBody');if(!body)return;let old=D.getElementById('v20pdf');if(old)old.style.display='none';if(D.getElementById('v21reports'))return;let resultsCard=body.closest('.card'),box=D.createElement('div');box.id='v21reports';box.className='card';box.innerHTML='<h2>Reports</h2><p class="tip">Download ready-to-print reports for the selected assessment.</p><div style="display:grid;gap:10px"><button id="v21pupils" class="btn">Download Combined Pupil Reports — 2 Pupils per Page</button><button id="v21stats" class="btn alt">Download Class Statistics & Analysis PDF</button><button id="v21csv" class="btn alt">Download Statistics CSV</button></div><p class="tip" style="margin-bottom:0">The class report includes class statistics, question/distractor analysis, LO mastery and intervention groups.</p>';resultsCard.parentNode.insertBefore(box,resultsCard);D.getElementById('v21pupils').onclick=()=>{let b=D.getElementById('v20pdfbtn');if(b)b.click();else alert('Combined pupil report is still loading. Please tap again.')};D.getElementById('v21stats').onclick=reportPdf;D.getElementById('v21csv').onclick=csv}setInterval(add,600)})();</script></body></html>
