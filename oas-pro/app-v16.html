<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="outer" src="app-v15.html?stable=16" title="OAS Pro"></iframe><script>
(function(){
 function d(){try{var a=document.getElementById('outer').contentDocument,f=a&&a.getElementById('outer'),b=f&&f.contentDocument,g=b&&b.getElementById('app');return g&&g.contentDocument}catch(e){return null}}
 function w(){try{return document.getElementById('outer').contentWindow.document.getElementById('outer').contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function data(){try{return {assessments:JSON.parse(localStorageProxy('oaspro_assessments')||'[]'),scans:JSON.parse(localStorageProxy('oaspro_scans')||'[]')}}catch(e){return {assessments:[],scans:[]}}}
 function localStorageProxy(k,v){var x=w();if(!x) return null;if(arguments.length>1)x.localStorage.setItem(k,v);return x.localStorage.getItem(k)}
 function download(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
 function current(){var x=w(),D=d();if(!x||!D)return null;var aid=D.getElementById('analysisAss')?.value||x.currentId;var all=data(),a=all.assessments.find(z=>z.id===aid),rows=all.scans.filter(z=>z.assessmentId===aid);return {a,rows,x,D}}
 function los(a,r){var out={},max=Number(a.questionCount)||30;for(var q=1;q<=max;q++){var lo=(a.lo?.[q]||'').trim();if(!lo)continue;if(!out[lo])out[lo]={e:0,t:0};var m=Number(a.marks?.[q]);if(!Number.isFinite(m))m=1;out[lo].t+=m;if(String(r.answers?.[q])===String(a.key?.[q]))out[lo].e+=m}return out}
 function slip(a,r,compact){var L=los(a,r),pct=r.total?Math.round(r.score/r.total*100):0;return '<section class="slip '+(compact?'compact':'')+'"><h2>'+esc(a.name||'Assessment Result')+'</h2><div class="meta"><b>'+esc(r.name||'—')+'</b> &nbsp; Index: '+esc(r.index||'—')+' &nbsp; <strong>'+r.score+'/'+r.total+' ('+pct+'%)</strong></div><table><thead><tr><th>Learning Outcome</th><th>Result</th><th>%</th></tr></thead><tbody>'+Object.entries(L).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v.e+'/'+v.t+'</td><td>'+Math.round(v.e/v.t*100)+'%</td></tr>').join('')+'</tbody></table></section>'}
 function printHtml(a,rows,compact){var html='<!doctype html><html><head><meta charset="utf-8"><title>Result Slips</title><style>@page{size:A4;margin:9mm}body{font-family:Arial,sans-serif;color:#111;margin:0}.slip{page-break-after:always;padding:8mm;box-sizing:border-box}.slip.compact{display:inline-block;vertical-align:top;width:49%;height:132mm;padding:5mm;page-break-after:auto;overflow:hidden;border:1px solid #ddd;margin:0 0 3mm 0}.slip.compact:nth-of-type(2n){margin-left:1%}h2{font-size:18px;margin:0 0 7px}.compact h2{font-size:14px}.meta{font-size:12px;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #bbb;padding:4px;text-align:left}.compact table{font-size:8px}.compact th,.compact td{padding:2px}@media print{button{display:none}}</style></head><body>'+rows.map(r=>slip(a,r,compact)).join('')+'<script>window.onload=function(){window.print()}<\/script></body></html>';var p=window.open('','_blank');p.document.write(html);p.document.close()}
 function add(){var D=d(),X=w();if(!D||!X||D.getElementById('oasExportTools'))return;var target=D.getElementById('resultsBody');if(!target)return;var card=target.closest('.card')||target.parentElement;var box=D.createElement('div');box.id='oasExportTools';box.style.cssText='margin:14px 0;padding:14px;border:1px solid #c7d2fe;border-radius:14px;background:#f5f7ff';box.innerHTML='<h3 style="margin-top:0">Export & Transfer Results</h3><p class="tip">Scanning data stays unchanged. Use Transfer Data on your phone, then Import Data on your desktop.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" id="allPdf">All Pupils PDF / Print</button><button class="btn alt" id="compactPdf">Compact PDF / Print</button><button class="btn alt" id="excelOut">Export Excel-compatible CSV</button><button class="btn alt" id="backupOut">Transfer Data</button><label class="btn alt" style="cursor:pointer">Import Data<input id="backupIn" type="file" accept="application/json,.json" style="display:none"></label></div><p id="exportMsg" class="tip"></p>';card.appendChild(box);
 D.getElementById('allPdf').onclick=()=>{var c=current();if(!c?.a||!c.rows.length)return alert('No results for this assessment.');printHtml(c.a,c.rows,false)};
 D.getElementById('compactPdf').onclick=()=>{var c=current();if(!c?.a||!c.rows.length)return alert('No results for this assessment.');printHtml(c.a,c.rows,true)};
 D.getElementById('excelOut').onclick=()=>{var c=current();if(!c?.a||!c.rows.length)return alert('No results to export.');var max=Number(c.a.questionCount)||30,heads=['Index','Name','Score','Total','Percent'];for(var q=1;q<=max;q++)heads.push('Q'+q);var lines=[heads.map(csv).join(',')];c.rows.forEach(r=>{var v=[r.index||'',r.name||'',r.score,r.total,r.total?Math.round(r.score/r.total*100):0];for(var q=1;q<=max;q++)v.push(r.answers?.[q]||'-');lines.push(v.map(csv).join(','))});download((c.a.name||'OAS-results').replace(/[^a-z0-9_-]+/gi,'_')+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')};
 function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
 D.getElementById('backupOut').onclick=()=>{var all=data();download('oas-pro-transfer-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'OASPRO_TRANSFER_V1',assessments:all.assessments,scans:all.scans},null,2),'application/json')};
 D.getElementById('backupIn').onchange=e=>{var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=()=>{try{var z=JSON.parse(rd.result);if(z.format!=='OASPRO_TRANSFER_V1'||!Array.isArray(z.assessments)||!Array.isArray(z.scans))throw Error('Not an OAS Pro transfer file');var old=data(),am=new Map(old.assessments.map(a=>[a.id,a])),sm=new Map(old.scans.map(s=>[s.id,s]));z.assessments.forEach(a=>am.set(a.id,a));z.scans.forEach(s=>sm.set(s.id,s));localStorageProxy('oaspro_assessments',JSON.stringify([...am.values()]));localStorageProxy('oaspro_scans',JSON.stringify([...sm.values()]));D.getElementById('exportMsg').textContent='✓ Imported safely. Existing records were kept; matching IDs were updated. Refreshing…';setTimeout(()=>location.reload(),900)}catch(err){alert('Import failed: '+err.message)}};rd.readAsText(f)};
 }
 setInterval(add,500);
})();
</script></body></html>
