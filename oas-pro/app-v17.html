<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><iframe id="outer" src="app-v15.html?stable=17" title="OAS Pro"></iframe><script>
(function(){
 function d(){try{var a=document.getElementById('outer').contentDocument,f=a&&a.getElementById('outer'),b=f&&f.contentDocument,g=b&&b.getElementById('app');return g&&g.contentDocument}catch(e){return null}}
 function w(){try{return document.getElementById('outer').contentWindow.document.getElementById('outer').contentWindow.document.getElementById('app').contentWindow}catch(e){return null}}
 function getData(){var x=w();try{return {assessments:JSON.parse(x.localStorage.getItem('oaspro_assessments')||'[]'),scans:JSON.parse(x.localStorage.getItem('oaspro_scans')||'[]')}}catch(e){return {assessments:[],scans:[]}}}
 function cur(){var D=d(),x=w();if(!D||!x)return null;var all=getData(),id=D.getElementById('analysisAss')?.value||x.currentId,a=all.assessments.find(v=>v.id===id);return {D,x,a,rows:all.scans.filter(v=>v.assessmentId===id)}}
 function mark(a,q){var m=Number(a.marks?.[q]);return Number.isFinite(m)?m:1}
 function loRows(a,r){var o={},max=Number(a.questionCount)||30;for(var q=1;q<=max;q++){var lo=(a.lo?.[q]||'').trim();if(!lo)continue;if(!o[lo])o[lo]={e:0,t:0};o[lo].t+=mark(a,q);if(String(r.answers?.[q])===String(a.key?.[q]))o[lo].e+=mark(a,q)}return Object.entries(o)}
 function safe(s){return String(s||'Result').replace(/[^a-z0-9_-]+/gi,'_').slice(0,60)}
 function drawSlip(pdf,a,r,x,y,wid,hei,compact){var pct=r.total?Math.round(r.score/r.total*100):0,pad=5,yy=y+pad;pdf.setDrawColor(190);pdf.rect(x,y,wid,hei);pdf.setFont('helvetica','bold');pdf.setFontSize(compact?10:15);pdf.text(String(a.name||'Assessment Result').slice(0,65),x+pad,yy+4);yy+=compact?9:12;pdf.setFontSize(compact?8:10);pdf.text('Name: '+String(r.name||'-').slice(0,35),x+pad,yy);pdf.text('Index: '+String(r.index||'-'),x+wid*.58,yy);yy+=5;pdf.setFont('helvetica','bold');pdf.text('Score: '+r.score+'/'+r.total+' ('+pct+'%)',x+pad,yy);yy+=6;pdf.setFont('helvetica','normal');var L=loRows(a,r);if(!L.length){pdf.text('No LO mapping.',x+pad,yy);return}var fs=compact?6.6:8;pdf.setFontSize(fs);for(var i=0;i<L.length;i++){var lo=L[i][0],v=L[i][1],p=v.t?Math.round(v.e/v.t*100):0;var text=pdf.splitTextToSize(lo,wid-(compact?27:35));var needed=Math.max(text.length*3.1,4);if(yy+needed>y+hei-pad)break;pdf.text(text,x+pad,yy);pdf.text(v.e+'/'+v.t,x+wid-(compact?20:27),yy);pdf.text(p+'%',x+wid-(compact?11:14),yy);yy+=needed+1}}
 function makePdf(rows,a,compact,name){if(!window.jspdf){alert('PDF library is still loading. Please tap again in a moment.');return}var jsPDF=window.jspdf.jsPDF,pdf=new jsPDF({unit:'mm',format:'a4'});if(compact){var slots=[[8,8],[106,8],[8,151],[106,151]],sw=95,sh=137;rows.forEach((r,i)=>{if(i&&i%4===0)pdf.addPage();var s=slots[i%4];drawSlip(pdf,a,r,s[0],s[1],sw,sh,true)})}else{rows.forEach((r,i)=>{if(i)pdf.addPage();drawSlip(pdf,a,r,10,10,190,277,false)})}pdf.save(name)}
 function add(){var D=d();if(!D||D.getElementById('simplePdfTools'))return;var body=D.getElementById('resultsBody');if(!body)return;var card=body.closest('.card')||body.parentElement,box=D.createElement('div');box.id='simplePdfTools';box.style.cssText='margin:14px 0;padding:14px;border:1px solid #c7d2fe;border-radius:14px;background:#f5f7ff';box.innerHTML='<h3 style="margin:0 0 6px">Download Result Slips</h3><p class="tip">PDF files download directly to this phone. Your scanned results are not changed.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" id="allPdfFile">Download All Pupils PDF</button><button class="btn alt" id="compactPdfFile">Download Compact PDF</button></div>';card.appendChild(box);
 D.getElementById('allPdfFile').onclick=()=>{var c=cur();if(!c?.a||!c.rows.length)return alert('No saved results for this assessment.');makePdf(c.rows,c.a,false,safe(c.a.name)+'_All_Pupils.pdf')};
 D.getElementById('compactPdfFile').onclick=()=>{var c=cur();if(!c?.a||!c.rows.length)return alert('No saved results for this assessment.');makePdf(c.rows,c.a,true,safe(c.a.name)+'_Compact.pdf')};
 }
 function addIndividual(){var D=d();if(!D)return;D.querySelectorAll('[data-slip]').forEach(b=>{if(b.dataset.pdfAdded)return;b.dataset.pdfAdded='1';var p=D.createElement('button');p.className='btn alt';p.textContent='PDF';p.style.marginLeft='5px';p.onclick=function(){var c=cur();if(!c?.a)return;var r=c.rows.find(z=>String(z.id)===String(b.dataset.slip));if(!r)return alert('Result not found.');makePdf([r],c.a,false,safe(c.a.name)+'_'+safe(r.index||r.name)+'_Result.pdf')};b.insertAdjacentElement('afterend',p)})}
 setInterval(()=>{add();addIndividual()},500);
})();
</script></body></html>
