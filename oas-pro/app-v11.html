<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAS Pro</title></head><body><p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px">Loading OAS Pro…</p><script>
fetch('app-v7.html?flex=11').then(r=>r.text()).then(src=>{
  const uiPatch=`  html=html.replace('<select id="assSelect" style="max-width:320px"></select>','<select id="assSelect" style="max-width:320px"></select><button id="editAss" class="btn alt">✏️ Edit selected</button><span id="editStatus" class="tip" style="width:100%"></span>');\n  html=html.replace('>Total marks</label><input id="assTotalMarks" type="text" value="30" readonly>','>Calculated total marks</label><input id="assTotalMarks" type="text" value="30" readonly>');\n  html=html.replace('<div class="card"><h3>Learning Objectives & Marks</h3><p class="tip">Assign the mark value for each question. Correct answers earn the full allocated mark; wrong or blank answers earn 0.</p><div id="loGrid" class="keygrid"></div></div>','<div class="card"><h3>Learning Objectives / Topics</h3><p class="tip">Paste one LO/topic per line in question order. Leave a line blank if that question has no LO.</p><textarea id="quickLo" placeholder="Example:\\nLife cycles\\nPlant growth\\n\\nMagnets"></textarea><button id="applyLo" class="btn alt" style="margin-top:8px">Apply LO list</button><div id="loGrid" class="keygrid" style="margin-top:12px"></div></div><div class="card"><h3>Marks per Question</h3><p class="tip">Marks are independent of the LO. Set questions individually, paste a marks list, or apply the same mark to every question.</p><textarea id="quickMarks" placeholder="Paste marks in question order, e.g. 1,1,2,1,2,1..."></textarea><div class="row" style="margin-top:8px"><button id="applyMarks" class="btn alt">Apply marks list</button><input id="sameMarkValue" type="number" min="0" step="0.5" value="1" style="max-width:110px" aria-label="Same mark for all questions"><button id="applySameMark" class="btn alt">Apply to all</button></div><div id="marksGrid" class="keygrid" style="margin-top:12px"></div></div>');\n`;
  src=src.replace('  const patch=`<script>',uiPatch+'  const patch=`<script>');
  const behavior=`\n  // Keep LO/topic and marks as separate controls.\n  buildKey=function(a){\n    $('keyGrid').innerHTML='';$('loGrid').innerHTML='';const max=qCount(a);\n    for(let q=1;q<=max;q++){\n      let d=document.createElement('div');d.className='keycell';\n      d.innerHTML='<b>Q'+q+'</b><div class="choices">'+[1,2,3,4].map(n=>'<button data-kq="'+q+'" data-ka="'+n+'" class="'+(String(a?.key?.[q]||'')===String(n)?'sel':'')+'">'+n+'</button>').join('')+'</div>';\n      $('keyGrid').appendChild(d);\n      let l=document.createElement('div');l.className='keycell';\n      l.innerHTML='<b>Q'+q+'</b><div style="margin-top:6px"><label style="font-size:12px;font-weight:800">LO / topic</label><input data-loq="'+q+'" value="'+esc(a?.lo?.[q]||'')+'" placeholder="Optional"></div>';\n      $('loGrid').appendChild(l);\n    }\n    document.querySelectorAll('[data-kq]').forEach(b=>b.onclick=()=>{let a=currentAss();if(!a)return;a.key[b.dataset.kq]=b.dataset.ka;buildKey(a);renderMarksGrid(a)});\n  };\n\n  function renderMarksGrid(a){\n    if(!$('marksGrid'))return;$('marksGrid').innerHTML='';if(!a)return;const max=qCount(a);\n    for(let q=1;q<=max;q++){\n      const d=document.createElement('div');d.className='keycell';\n      d.innerHTML='<b>Q'+q+'</b><div style="margin-top:6px"><label style="font-size:12px;font-weight:800">Marks</label><input data-qmark="'+q+'" type="number" min="0" step="0.5" value="'+markFor(a,q)+'"></div>';\n      $('marksGrid').appendChild(d);\n    }\n    document.querySelectorAll('[data-qmark]').forEach(i=>i.oninput=()=>{const a=currentAss();if(!a)return;if(!a.marks)a.marks={};let v=parseFloat(i.value);a.marks[i.dataset.qmark]=Number.isFinite(v)&&v>=0?v:0;updateTotalBox(a)});\n    updateTotalBox(a);\n  }\n\n  const originalLoadAss=loadAss;\n  loadAss=function(){originalLoadAss();renderMarksGrid(currentAss())};\n  if($('assQuestionCount'))$('assQuestionCount').addEventListener('input',()=>setTimeout(()=>renderMarksGrid(currentAss()),0));\n\n  if($('applyLo'))$('applyLo').onclick=()=>{\n    let a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    const lines=$('quickLo').value.replace(/\\r/g,'').split('\\n');\n    const max=qCount(a);a.lo=a.lo||{};\n    for(let q=1;q<=max;q++)a.lo[q]=(lines[q-1]||'').trim();\n    buildKey(a);renderMarksGrid(a);\n  };\n\n  if($('applyMarks'))$('applyMarks').onclick=()=>{\n    let a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    if(!a.marks)a.marks={};const vals=$('quickMarks').value.trim().split(/[\\s,;|]+/).filter(Boolean);\n    if(!vals.length)return alert('Enter the marks first, for example: 1,1,2,1,2');\n    const max=qCount(a);for(let q=1;q<=Math.min(max,vals.length);q++){const v=parseFloat(vals[q-1]);if(Number.isFinite(v)&&v>=0)a.marks[q]=v}\n    renderMarksGrid(a);updateTotalBox(a);\n  };\n\n  if($('applySameMark'))$('applySameMark').onclick=()=>{\n    let a=currentAss();if(!a)return alert('Select or create an assessment first.');\n    const v=parseFloat($('sameMarkValue').value);if(!Number.isFinite(v)||v<0)return alert('Enter a valid mark, for example 1 or 2.');\n    if(!a.marks)a.marks={};for(let q=1;q<=qCount(a);q++)a.marks[q]=v;\n    renderMarksGrid(a);updateTotalBox(a);\n  };\n\n  if($('editAss'))$('editAss').onclick=()=>{\n    const id=$('assSelect').value;if(!id)return alert('Select an assessment first.');currentId=id;try{localStorage.setItem('oaspro_current',currentId)}catch(e){}\n    loadAss();const a=currentAss();if($('editStatus'))$('editStatus').innerHTML='<span class="ok">Editing <b>'+esc(a?.name||'assessment')+'</b>. Change any details, then tap <b>Save assessment</b>.</span>';window.scrollTo({top:0,behavior:'smooth'});\n  };\n`;
  src=src.replace('  refresh();\n})();',behavior+'\n  refresh();\n})();');
  src=src.replace("<title>OAS Pro</title>","<title>OAS Pro v11</title>");
  document.open();document.write(src);document.close();
}).catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:20px;color:#b91c1c">Could not load OAS Pro: '+e.message+'</p>'});
</script></body></html>
