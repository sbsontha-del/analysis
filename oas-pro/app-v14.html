<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v7.html?stable=14" title="OAS Pro"></iframe><script>
(function(){
 const frame=document.getElementById('app');let enhancedDoc=null;
 function enhance(){
  let d;try{d=frame.contentDocument}catch(e){return}
  if(!d||!d.getElementById('loGrid'))return;
  const loGrid=d.getElementById('loGrid');
  if(enhancedDoc===d&&d.getElementById('simpleMarkTools'))return;
  enhancedDoc=d;

  // Hide any separate Marks per Question section. Marks belong directly under each LO.
  [...d.querySelectorAll('.card')].forEach(c=>{
    const h=[...c.querySelectorAll('h3')].find(x=>x.textContent.trim()==='Marks per Question');
    if(h&&c!==loGrid.closest('.card'))c.style.display='none';
  });

  const card=loGrid.closest('.card');if(!card)return;
  const h3=card.querySelector('h3');if(h3)h3.textContent='Learning Objectives & Marks';
  const tip=card.querySelector('.tip');if(tip)tip.textContent='Each question shows its LO/topic and the mark directly underneath. A question with no LO defaults to 0 marks.';

  function qNum(el){return Number(el?.dataset?.loq||el?.dataset?.mq||el?.dataset?.qmark||0)}
  function loInputs(){return [...d.querySelectorAll('[data-loq]')]}
  function allMarkInputs(){return [...d.querySelectorAll('[data-mq],[data-qmark]')]}
  function markInputFor(q){return d.querySelector('[data-mq="'+q+'"],[data-qmark="'+q+'"]')}
  function maxQ(){return Math.max(0,...loInputs().map(qNum),...allMarkInputs().map(qNum))}
  function setMark(q,v){const i=markInputFor(q);if(!i)return;i.value=String(v);i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}))}

  // Ensure every LO card visibly contains its mark field directly underneath.
  loInputs().forEach(lo=>{
    const q=qNum(lo);let m=markInputFor(q);const cell=lo.closest('.keycell')||lo.parentElement;
    if(!cell)return;
    if(m&&!cell.contains(m)){
      const wrap=d.createElement('div');wrap.style.marginTop='8px';wrap.innerHTML='<label style="font-size:12px;font-weight:800">Marks</label>';
      m.parentNode&&m.parentNode.removeChild(m);wrap.appendChild(m);cell.appendChild(wrap);
    } else if(!m){
      const wrap=d.createElement('div');wrap.style.marginTop='8px';
      wrap.innerHTML='<label style="font-size:12px;font-weight:800">Marks</label><input data-mq="'+q+'" type="number" min="0" step="0.5" value="'+(lo.value.trim()?1:0)+'">';
      cell.appendChild(wrap);m=wrap.querySelector('input');
      m.addEventListener('input',()=>{try{const w=frame.contentWindow,a=w.currentAss&&w.currentAss();if(a){a.marks=a.marks||{};a.marks[q]=Math.max(0,Number(m.value)||0);if(w.updateTotalBox)w.updateTotalBox(a)}}catch(e){}});
    }
    if(!lo.value.trim()&&(m.value===''||Number(m.value)===1))setMark(q,0);
  });

  if(!d.getElementById('simpleMarkTools')){
    const tools=d.createElement('div');tools.id='simpleMarkTools';
    tools.innerHTML=`<div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc"><h4 style="margin:0 0 8px">Paste LO / Topic List</h4><p class="tip" style="margin:0 0 8px">One line per question. Leave a line blank if the question has no LO.</p><textarea id="bulkLoList" placeholder="Example:\nLife cycles\nPlant growth\n\nMagnets"></textarea><button id="applyBulkLo" class="btn alt" style="margin-top:8px">Apply LO list</button></div><div style="margin:12px 0;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc"><h4 style="margin:0 0 8px">Apply Marks</h4><p class="tip" style="margin:0 0 8px">Choose the questions and mark value. You will see the result immediately under each LO.</p><div class="grid g2"><select id="simpleMarkSet"></select><input id="simpleMarkValue" type="number" min="0" step="0.5" value="1"></div><div id="simpleRange" class="grid g2" style="display:none;margin-top:8px"><select id="simpleFrom"></select><select id="simpleTo"></select></div><button id="applySimpleMarks" class="btn alt" style="margin-top:8px">Apply marks</button></div>`;
    loGrid.parentNode.insertBefore(tools,loGrid);

    function fill(){
      const max=maxQ(),s=d.getElementById('simpleMarkSet');if(!max||!s)return;
      const opts=[['all','All questions'],['withlo','Questions with an LO'],['nolo','Questions without an LO']];
      for(let a=1;a<=max;a+=5){const b=Math.min(max,a+4);opts.push(['r:'+a+'-'+b,'Q'+a+'–Q'+b])}
      opts.push(['custom','Custom range…']);s.innerHTML=opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
      const qo=Array.from({length:max},(_,i)=>'<option value="'+(i+1)+'">Q'+(i+1)+'</option>').join('');d.getElementById('simpleFrom').innerHTML=qo;d.getElementById('simpleTo').innerHTML=qo;d.getElementById('simpleTo').value=String(max);
    }
    fill();
    d.getElementById('simpleMarkSet').onchange=e=>d.getElementById('simpleRange').style.display=e.target.value==='custom'?'grid':'none';
    d.getElementById('applySimpleMarks').onclick=()=>{
      const v=Number(d.getElementById('simpleMarkValue').value);if(!Number.isFinite(v)||v<0){alert('Enter a valid mark value.');return}
      const mode=d.getElementById('simpleMarkSet').value,max=maxQ();let qs=[];
      if(mode==='all')qs=Array.from({length:max},(_,i)=>i+1);
      else if(mode==='withlo')qs=loInputs().filter(i=>i.value.trim()).map(qNum);
      else if(mode==='nolo')qs=loInputs().filter(i=>!i.value.trim()).map(qNum);
      else if(mode.startsWith('r:')){let [a,b]=mode.slice(2).split('-').map(Number);for(let q=a;q<=b;q++)qs.push(q)}
      else if(mode==='custom'){let a=Number(d.getElementById('simpleFrom').value),b=Number(d.getElementById('simpleTo').value);if(a>b)[a,b]=[b,a];for(let q=a;q<=b;q++)qs.push(q)}
      qs.forEach(q=>setMark(q,v));enhance();
    };
    d.getElementById('applyBulkLo').onclick=()=>{
      const lines=d.getElementById('bulkLoList').value.replace(/\r/g,'').split('\n');
      loInputs().forEach((lo,idx)=>{lo.value=(lines[idx]||'').trim();lo.dispatchEvent(new Event('change',{bubbles:true}));if(!lo.value.trim())setMark(qNum(lo),0)});enhance();
    };
  }

  loInputs().forEach(lo=>{if(!lo.dataset.markSync){lo.dataset.markSync='1';lo.addEventListener('change',()=>{if(!lo.value.trim())setMark(qNum(lo),0)})}});
 }
 frame.addEventListener('load',()=>{let n=0,t=setInterval(()=>{enhance();if(++n>120)clearInterval(t)},100)});
 setInterval(enhance,700);
})();
</script></body></html>
