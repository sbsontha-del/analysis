(function(){const F=document.getElementById('app');function D(){try{return F.contentDocument}catch(e){return null}}function W(){try{return F.contentWindow}catch(e){return null}}function get(){let w=W();try{return{A:JSON.parse(w.localStorage.getItem('oaspro_assessments')||'[]'),S:JSON.parse(w.localStorage.getItem('oaspro_scans')||'[]')}}catch(e){return{A:[],S:[]}}}function cur(){let d=D(),w=W(),g=get(),id=d?.getElementById('analysisAss')?.value||w?.currentId,a=g.A.find(x=>x.id===id);return{d,w,a,rows:g.S.filter(x=>x.assessmentId===id)}}function qn(a){return Math.max(1,Math.min(60,Number(a?.questionCount)||30))}function pc(n,d){return d?Math.round(n/d*100):0}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(s){return String(s||'Results').replace(/[^a-z0-9_-]+/gi,'_').slice(0,55)}function mark(a,q){let m=Number(a?.marks?.[q]);return Number.isFinite(m)?m:1}

function css(d){if(d.getElementById('v20css'))return;let s=d.createElement('style');s.id='v20css';s.textContent='.v20stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.v20stat{background:#f8fafc;padding:10px;border-radius:12px;text-align:center}.v20stat b{display:block;font-size:20px}.v20scroll{overflow:auto}.v20scroll table{min-width:720px}.v20pill{padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800}.v20good{background:#dcfce7;color:#166534}.v20mid{background:#fef3c7;color:#92400e}.v20weak{background:#fee2e2;color:#991b1b}.v20modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;padding:12px;overflow:auto}.v20modal.open{display:block}.v20box{background:#fff;max-width:900px;margin:15px auto;padding:18px;border-radius:16px}.v20answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}.v20ans{border:1px solid #ddd;border-radius:9px;padding:7px;text-align:center}.v20ok{background:#f0fdf4}.v20no{background:#fff1f2}';d.head.appendChild(s)}

function slip(id){let c=cur(),r=c.rows.find(x=>String(x.id)===String(id));if(!c.a||!r)return;modal(c.d);let cells='';for(let q=1;q<=qn(c.a);q++){let v=String(r.answers?.[q]||'-'),k=String(c.a.key?.[q]||'-'),ok=v===k;cells+='<div class="v20ans '+(ok?'v20ok':'v20no')+'"><b>Q'+q+'</b><br>'+(ok?'('+esc(v)+') ✓':esc(v)+' ✕ ('+esc(k)+')')+'</div>'}let L=loStats(c.a,r),los=Object.entries(L).map(([l,v])=>'<tr><td>'+esc(l)+'</td><td>'+v.qs.join(', ')+'</td><td>'+v.e+'/'+v.t+'</td><td>'+pc(v.e,v.t)+'%</td></tr>').join('');c.d.getElementById('v20content').innerHTML='<h2>'+esc(c.a.name||'Assessment Result')+'</h2><p><b>'+esc(r.name||'—')+'</b> &nbsp; Index: '+esc(r.index||'—')+' &nbsp; Score: <b>'+r.score+'/'+r.total+' ('+pc(r.score,r.total)+'%)</b></p><h3>Answer Analysis</h3><div class="v20answers">'+cells+'</div><h3>LO Analysis</h3><div class="v20scroll"><table><tbody>'+los+'</tbody></table></div>';c.d.getElementById('v20modal').classList.add('open')}

function pdf(){let c=cur();if(!c.a||!c.rows.length)return alert('No results.');if(!window.jspdf)return alert('PDF library is loading.');let P=window.jspdf.jsPDF,p=new P({unit:'mm',format:'a4'}),slots=[8,150];c.rows.forEach((r,i)=>{if(i&&i%2===0)p.addPage();let y=slots[i%2],h=139,x=8,w=194,yy=y+7;p.setDrawColor(180);p.roundedRect(x,y,w,h,2,2);p.setFont('helvetica','bold');p.setFontSize(10);p.text(String(r.name||('Index '+(r.index||'-'))),x+4,yy);p.setFontSize(8);p.text('Index '+String(r.index||'-')+'   Score '+r.score+'/'+r.total+' ('+pc(r.score,r.total)+'%)',x+105,yy);yy+=5;p.setFontSize(7);p.text('ANSWER ANALYSIS',x+4,yy);yy+=3.5;p.setFont('helvetica','normal');p.setFontSize(5.8);let max=qn(c.a),cols=10,cw=18.5;for(let q=1;q<=max;q++){let row=Math.floor((q-1)/cols),col=(q-1)%cols,v=String(r.answers?.[q]||'-'),k=String(c.a.key?.[q]||'-');p.text('Q'+q+' '+(v===k?'('+v+') OK':v+' X('+k+')'),x+4+col*cw,yy+row*3.3)}yy+=Math.ceil(max/cols)*3.3+3;p.setFont('helvetica','bold');p.setFontSize(7);p.text('LO ANALYSIS',x+4,yy);yy+=3.5;p.setFont('helvetica','normal');p.setFontSize(5.7);for(let [L,v] of Object.entries(loStats(c.a,r))){if(yy>y+h-42)break;let t=p.splitTextToSize(L,w-35);p.text(t,x+4,yy);p.text(v.e+'/'+v.t+' '+pc(v.e,v.t)+'%',x+w-28,yy);yy+=Math.max(3,t.length*2.5)}yy=Math.min(yy+2,y+h-38);p.setFont('helvetica','bold');p.setFontSize(7);p.text('ANNOTATED OAS',x+4,yy);yy+=2;let ih=y+h-yy-4;if(r.scanImage&&ih>10){try{p.addImage(r.scanImage,'JPEG',x+4,yy,w-8,ih,undefined,'FAST')}catch(e){p.text('Scan image unavailable.',x+4,yy+5)}}else{p.setFont('helvetica','normal');p.setFontSize(6);let wrong=[];for(let q=1;q<=max;q++)if(String(r.answers?.[q])!==String(c.a.key?.[q]))wrong.push('Q'+q+':'+(r.answers?.[q]||'-')+'>'+c.a.key?.[q]);p.text(p.splitTextToSize('Original image unavailable. Corrections: '+(wrong.join(', ')||'All correct'),w-8),x+4,yy+5)}});p.save(safe(c.a.name)+'_Pupil_Reports_2_Per_Page.pdf')}
function enhance(){let c=cur();if(!c.d)return;css(c.d);let heat=c.d.getElementById('heat'),body=c.d.getElementById('resultsBody');if(!heat||!body)return;if(!c.d.getElementById('v20analysis')){let card=heat.closest('.card'),b=c.d.createElement('div');b.id='v20analysis';b.className='card';b.innerHTML='<h3>Detailed Class Analysis</h3><div id="v20stats" class="v20stats"></div><h4>Question & Distractor Analysis</h4><div class="v20scroll"><table><thead><tr><th>Q</th><th>% Correct</th><th>Most Common Wrong</th><th>LO</th><th>Status</th></tr></thead><tbody id="v20q"></tbody></table></div><h4>LO Mastery & Intervention Groups</h4><div id="v20lo"></div>';card.parentNode.insertBefore(b,card.nextSibling)}let ps=c.rows.map(r=>pc(r.score,r.total)).sort((a,b)=>a-b),mean=ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0,med=ps.length?(ps.length%2?ps[(ps.length-1)/2]:Math.round((ps[ps.length/2-1]+ps[ps.length/2])/2)):0;c.d.getElementById('v20stats').innerHTML=[['Mean',mean+'%'],['Median',med+'%'],['Highest',(ps.at(-1)??0)+'%'],['Lowest',(ps[0]??0)+'%'],['Pass ≥50%',pc(ps.filter(x=>x>=50).length,ps.length)+'%']].map(x=>'<div class="v20stat"><b>'+x[1]+'</b>'+x[0]+'</div>').join('');let qhtml='',los={};for(let q=1;q<=qn(c.a||{});q++){let key=String(c.a?.key?.[q]||''),ok=0,cnt={1:0,2:0,3:0,4:0};c.rows.forEach(r=>{let v=String(r.answers?.[q]||'');if(v===key)ok++;else if(cnt[v]!=null)cnt[v]++});let p=pc(ok,c.rows.length),w=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0],L=(c.a?.lo?.[q]||'').trim(),cl=p>=75?'v20good':p>=50?'v20mid':'v20weak',st=p>=75?'Mastered':p>=50?'Review':'Reteach';qhtml+='<tr><td>Q'+q+'</td><td>'+p+'%</td><td>'+(w&&w[1]?w[0]+' ('+w[1]+')':'—')+'</td><td>'+esc(L||'—')+'</td><td><span class="v20pill '+cl+'">'+st+'</span></td></tr>';if(L){if(!los[L])los[L]={ok:0,n:0,weak:[]};los[L].ok+=ok;los[L].n+=c.rows.length}}c.d.getElementById('v20q').innerHTML=qhtml;let lhtml='';for(let [L,v] of Object.entries(los)){let p=pc(v.ok,v.n),names=c.rows.filter(r=>{let qs=[];for(let function capture(){let d=D(),w=W();if(!d||d.body.dataset.cap20)return;let b=d.getElementById('saveScan');if(!b||typeof b.onclick!=='function')return;d.body.dataset.cap20='1';let old=b.onclick;b.onclick=function(e){let img='';try{let p=d.getElementById('preview');if(p&&p.width&&p.height)img=p.toDataURL('image/jpeg',.55)}catch(x){}let idx=d.getElementById('studentIndex')?.value.trim(),aid=w.currentId;old.call(this,e);if(img)try{let arr=JSON.parse(w.localStorage.getItem('oaspro_scans')||'[]'),m=arr.filter(r=>r.assessmentId===aid&&(!idx||String(r.index||'')===idx)),r=m[m.length-1];if(r){r.scanImage=img;w.localStorage.setItem('oaspro_scans',JSON.stringify(arr));w.scans=arr}}catch(x){}}}
