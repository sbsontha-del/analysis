<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OAS Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100%;display:block}</style><script src="lo-preset-p5-setb.js"></script></head><body><iframe id="outer" src="app-v14.html?stable=15" title="OAS Pro"></iframe><script>(function(){function doc(){try{var a=document.getElementById('outer').contentDocument;var f=a&&a.getElementById('app');return f&&f.contentDocument}catch(e){return null}}function add(){var d=doc();if(!d||!d.getElementById('loGrid')||d.getElementById('moeLoPreset'))return;var grid=d.getElementById('loGrid'),card=grid.closest('.card');if(!card)return;var box=d.createElement('div');box.id='moeLoPreset';box.style.cssText='margin:12px 0;padding:12px;border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff';box.innerHTML='<h4 style="margin:0 0 6px">P5 Science Practice Paper — MOE-aligned LOs</h4><p class="tip">Load the question-specific learning outcomes for Q1–30.</p><button id="loadMoeLos" class="btn alt">Load LOs for Q1–30</button><span id="moeLoStatus" style="margin-left:8px;font-size:12px;font-weight:700"></span>';card.insertBefore(box,grid);d.getElementById('loadMoeLos').onclick=function(){var n=0;for(var q=1;q<=30;q++){var i=d.querySelector('[data-loq="'+q+'"]');if(i){i.value=window.P5_SETB_LOS[q];i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));n++}}d.getElementById('moeLoStatus').textContent='✓ '+n+' LOs loaded — click Save Assessment.';};}setInterval(add,500)})();</script></body></html>
